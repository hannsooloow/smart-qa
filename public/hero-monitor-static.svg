<svg viewBox="0 0 1240 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SmartQA Autopilot hero monitor</title>
  <desc id="desc">Static monitor mockup showing SmartQA Autopilot workflow stages and release metrics.</desc>
  <defs>
    <linearGradient id="monitorFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1520"/>
      <stop offset="52%" stop-color="#0A0F17"/>
      <stop offset="100%" stop-color="#313949"/>
    </linearGradient>
    <linearGradient id="monitorLip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#313949"/>
      <stop offset="50%" stop-color="#1B2230"/>
      <stop offset="100%" stop-color="#454F61"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111C"/>
      <stop offset="60%" stop-color="#09131F"/>
      <stop offset="100%" stop-color="#0C1521"/>
    </linearGradient>
    <linearGradient id="wireGlow" x1="160" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="baseGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#485266"/>
      <stop offset="35%" stop-color="#222B39"/>
      <stop offset="100%" stop-color="#0F1621"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="screenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="32" flood-color="#020817" flood-opacity="0.42"/>
    </filter>
  </defs>

