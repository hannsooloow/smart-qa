<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Issues surface after release</title>
  <desc id="desc">A dark premium SmartQA diagnostic card showing that issues surface after release, with a warning icon, release path and red issue marker.</desc>
  <defs>
    <linearGradient id="cardFill" x1="268" y1="134" x2="962" y2="777" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151F2D"/>
      <stop offset="0.48" stop-color="#0D1622"/>
      <stop offset="1" stop-color="#090F18"/>
    </linearGradient>
    <linearGradient id="edge" x1="278" y1="118" x2="936" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="0.44" stop-color="#1E293B" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="332" y1="151" x2="861" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263449" stop-opacity="0.52"/>
      <stop offset="0.47" stop-color="#162333" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="373" y1="166" x2="930" y2="722" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B77"/>
      <stop offset="0.55" stop-color="#FF4D5B"/>
      <stop offset="1" stop-color="#FF3246"/>
    </linearGradient>
    <linearGradient id="softLine" x1="325" y1="634" x2="775" y2="634" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.11" stop-color="#D9E2F0" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#B9C5D6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="cardShadow" x="223" y="87" width="752" height="758" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="36" stdDeviation="42" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
    <filter id="redGlow" x="281" y="109" width="752" height="692" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 1 0 0 0.19  0 0 1 0 0.24  0 0 0 0.55 0" result="redblur"/>
      <feBlend in="SourceGraphic" in2="redblur" mode="screen"/>
    </filter>
    <filter id="bigGlow" x="666" y="454" width="314" height="304" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 1 0 0 0.11  0 0 1 0 0.18  0 0 0 0.72 0" result="colored"/>
      <feBlend in="SourceGraphic" in2="colored" mode="screen"/>
    </filter>
    <filter id="textShadow" x="0" y="0" width="1200" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <radialGradient id="spot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(802 610) rotate(90) scale(163 226)">
      <stop stop-color="#FF4454" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FF4454" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF4454" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftDust" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(324 645) rotate(90) scale(105 43)">
      <stop stop-color="#A7B3C4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A7B3C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="254" y="114" width="690" height="720" rx="58"/>
    </clipPath>
  </defs>

  <!-- transparent outside area -->
  <g filter="url(#cardShadow)">
    <rect x="254" y="114" width="690" height="720" rx="58" fill="url(#cardFill)"/>
    <rect x="254" y="114" width="690" height="720" rx="58" stroke="url(#edge)" stroke-width="2"/>
  </g>
  <rect x="281" y="142" width="636" height="666" rx="45" fill="url(#innerGlow)" stroke="#334155" stroke-opacity="0.55" stroke-width="2"/>

  <g clip-path="url(#cardClip)">
    <rect x="254" y="114" width="690" height="720" fill="url(#spot)"/>
    <rect x="254" y="114" width="690" height="720" fill="url(#leftDust)"/>
    <path d="M292 120V828" stroke="#FFFFFF" stroke-opacity="0.025"/>
    <path d="M432 120V828" stroke="#FFFFFF" stroke-opacity="0.026"/>
    <path d="M602 120V828" stroke="#FFFFFF" stroke-opacity="0.03"/>
    <path d="M746 120V828" stroke="#FFFFFF" stroke-opacity="0.026"/>
    <path d="M878 120V828" stroke="#FFFFFF" stroke-opacity="0.022"/>
    <path d="M279 144C330 205 390 249 458 274" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1.5"/>
  </g>

  <!-- Icon -->
  <g filter="url(#redGlow)">
    <circle cx="370" cy="212" r="52" fill="#151C2A" stroke="url(#redGrad)" stroke-width="5"/>
    <line x1="370" y1="183" x2="370" y2="221" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="370" y1="183" x2="370" y2="221" stroke="#FF4B5B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="370" cy="241" r="5.6" fill="#FFFFFF"/>
  </g>

  <!-- Header number -->
  <text x="462" y="219" fill="#FF5968" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="1.5" filter="url(#textShadow)">01</text>

  <!-- Title -->
  <text x="462" y="306" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" filter="url(#textShadow)">Issues surface</text>
  <text x="462" y="361" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" filter="url(#textShadow)">after release</text>

  <!-- Body -->
  <text x="327" y="444" fill="#C6D0DD" fill-opacity="0.92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.5" filter="url(#textShadow)">Bugs and gaps appear in</text>
  <text x="327" y="500" fill="#C6D0DD" fill-opacity="0.92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.5" filter="url(#textShadow)">production, not in testing.</text>

  <!-- Path -->
  <g opacity="0.95">
    <path d="M331 665 C374 606, 421 618, 467 635 C512 652, 554 663, 603 653 C650 644, 690 640, 735 647 C758 650, 778 644, 794 628" stroke="#0A0F17" stroke-width="12" stroke-linecap="round" opacity="0.65"/>
    <path d="M331 665 C374 606, 421 618, 467 635 C512 652, 554 663, 603 653 C650 644, 690 640, 735 647 C758 650, 778 644, 794 628" stroke="url(#softLine)" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9"/>
    <circle cx="327" cy="666" r="12" fill="#FF4A58" stroke="#17202D" stroke-width="5"/>
    <circle cx="432" cy="629" r="14" fill="#FF6973" stroke="#17202D" stroke-width="5"/>
    <circle cx="573" cy="655" r="13" fill="#FF6973" stroke="#17202D" stroke-width="5"/>
    <circle cx="706" cy="650" r="13" fill="#FF6973" stroke="#17202D" stroke-width="5"/>
    <circle cx="327" cy="666" r="20" fill="#FF4A58" fill-opacity="0.12"/>
    <circle cx="432" cy="629" r="24" fill="#FF4A58" fill-opacity="0.08"/>
  </g>

  <!-- Big alert burst -->
  <g filter="url(#bigGlow)">
    <circle cx="822" cy="633" r="67" fill="#FF3C4E"/>
    <circle cx="822" cy="633" r="67" stroke="#FF7782" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="822" y1="581" x2="822" y2="623" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="822" y1="581" x2="822" y2="623" stroke="#FF5362" stroke-width="7" stroke-linecap="round"/>
    <circle cx="822" cy="660" r="6" fill="#FFFFFF"/>
    <g stroke="#FF4A58" stroke-width="5" stroke-linecap="round">
      <line x1="822" y1="532" x2="822" y2="493"/>
      <line x1="822" y1="734" x2="822" y2="773"/>
      <line x1="721" y1="633" x2="682" y2="633"/>
      <line x1="923" y1="633" x2="962" y2="633"/>
      <line x1="751" y1="562" x2="720" y2="531"/>
      <line x1="893" y1="704" x2="924" y2="735"/>
      <line x1="893" y1="562" x2="924" y2="531"/>
      <line x1="751" y1="704" x2="720" y2="735"/>
      <line x1="778" y1="540" x2="762" y2="508"/>
      <line x1="866" y1="726" x2="882" y2="758"/>
      <line x1="733" y1="589" x2="700" y2="575"/>
      <line x1="911" y1="677" x2="944" y2="691"/>
    </g>
  </g>
</svg>
